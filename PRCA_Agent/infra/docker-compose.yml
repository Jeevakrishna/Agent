services:
  db:
    image: pgvector/pgvector:pg16
    container_name: prca-db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prca
    ports:
      - "5432:5432"
    volumes:
      - prca-db-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prca"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  prca-db-data:
    name: prca-db-data
